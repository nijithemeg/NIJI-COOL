 const q=$("#search").value.toLowerCase(),L=lk();
 $("#posts").innerHTML=POSTS.filter(p=>(cat==="all"||p.c[lang]===cat)&&(p.t[lang]+p.b[lang]).toLowerCase().includes(q)).map(p=>`
 <article class="card"><div class="cat">${esc(p.c[lang])}</div><h3>${esc(p.t[lang])}</h3><p>${esc(p.b[lang])}</p>
 <div class="row"><button class="btn alt like" data-id="${p.id}">${L[p.id]?"♥":"♡"} ${T("like")}</button>
 <details style="flex:1;min-width:180px"><summary>${T("comment")}</summary><div class="cm" id="cm-${p.id}"></div>
 <input id="ci-${p.id}" placeholder="${T("addC")}"><button class="btn alt cs" data-id="${p.id}">${T("send")}</button></details></div></article>`).join("");
 renderQA();paintAds();paintClock();
}
function paintAds(){["#ad1"].forEach(s=>{const e=$(s);e.hidden=settings.adsOff===true;e.textContent=settings.adNote||T("adSlot")})}
function renderQA(){
 const a=qaDocs.filter(d=>d.answer);
 $("#qaList").innerHTML=a.length?a.map(d=>`<details><summary>${esc(d.text)}</summary><p>${esc(d.answer)}</p></details>`).join(""):`<p>${T("noQ")}</p>`;
}
function paintClock(){
 const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"UTC",loc={ar:"ar-DZ",fr:"fr-FR",en:"en-GB"}[lang];
 $("#clock").textContent=new Date().toLocaleString(loc,{dateStyle:"full",timeStyle:"medium"})+" · "+tz.replace(/_/g," ");
}
setInterval(paintClock,1000);

/* istighfar bubble */
let ii=0;function istg(){const b=$("#istg"),l=T("istg");b.style.opacity=0;setTimeout(()=>{b.textContent=T("sadaqa")+": "+l[ii++%l.length];b.style.opacity=1},500)}
setInterval(istg,9000);

/* events */
$("#lang").onchange=e=>{lang=e.target.value;try{localStorage.setItem("nc_lang",lang)}catch(_){}render();istg()};
$("#theme").onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue("--bg").trim()==="#07182a";r.dataset.theme=d?"light":"dark"};
$("#search").oninput=render;
document.addEventListener("click",async e=>{
 const t=e.target;
 if(t.dataset.c){cat=t.dataset.c;render()}
 if(t.classList.contains("like")){const L=lk();if(L[t.dataset.id])return;L[t.dataset.id]=1;try{localStorage.setItem("nc_likes",JSON.stringify(L))}catch(_){}
  if(db&&user)try{await db.collection("likes").add({post:t.dataset.id,uid:await user.id(),ts:Date.now()})}catch(_){}render()}
 if(t.classList.contains("cs")){const i=$("#ci-"+t.dataset.id),v=i.value.trim();if(!v)return;
  try{await db.collection("comments").add({post:t.dataset.id,text:v.slice(0,500),ts:Date.now(),ok:true});i.value=""}catch(_){i.placeholder=T("fail")}}
});
async function submit(col,data,msg){try{if(!db)throw 0;await db.collection(col).add({...data,ts:Date.now(),lang});$(msg).textContent=T("sent")}catch(_){$(msg).textContent=T("fail")}}
$("#qSend").onclick=()=>{const t=$("#qText").value.trim();if(t){submit("questions",{name:$("#qName").value.slice(0,60),text:t.slice(0,600)},"#qMsg");$("#qText").value=""}};
$("#sSend").onclick=()=>{const t=$("#sText").value.trim();if(t){submit("tickets",{name:$("#sName").value.slice(0,60),contact:$("#sContact").value.slice(0,80),text:t.slice(0,800),status:"open"},"#sMsg");$("#sText").value=""}};

/* admin (owner only) */
const TABS=["Overview","Sales","Comments","Questions","Support","Ads","Settings"];
let tab="Overview";const D={};
function money(n){return Number(n||0).toLocaleString()+" DA"}
function drawAdmin(){
 $("#tabs").innerHTML=TABS.map(t=>`<button class="tag ${t===tab?"on":""}" data-tab="${t}">${t}</button>`).join("");
 const B=$("#tabBody"),g=c=>D[c]||[];
 if(!owner){$("#tabs").innerHTML="";$("#tabBody").innerHTML=`<input id="lE" type="email" placeholder="Email" autocomplete="username"><input id="lP" type="password" placeholder="Password" autocomplete="current-password"><button class="btn" id="lGo">Login</button> <small id="lM"></small>`;$("#lGo").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("#lE").value.trim(),$("#lP").value)}catch(e){$("#lM").textContent="Login failed"}};return}
 if(tab==="Overview"){const day=Date.now()-864e5,s=g("ledger").filter(x=>x.type==="sale").reduce((a,x)=>a+x.amount,0),p=g("ledger").filter(x=>x.type==="purchase").reduce((a,x)=>a+x.amount,0);
  B.innerHTML=`<div class="stat"><div><b>${g("visits").length}</b>Visits</div><div><b>${g("visits").filter(x=>x.ts>day).length}</b>Last 24h</div><div><b>${g("likes").length}</b>Likes</div><div><b>${g("comments").length}</b>Comments</div><div><b>${g("questions").length}</b>Questions</div><div><b>${g("tickets").length}</b>Tickets</div><div><b>${money(s)}</b>Sales</div><div><b>${money(p)}</b>Purchases</div><div><b>${money(s-p)}</b>Profit</div></div>
  <h3>Likes per article</h3><div class="tbl"><table>${POSTS.map(x=>`<tr><td>${esc(x.t.en)}</td><td>${g("likes").filter(l=>l.post===x.id).length}</td></tr>`).join("")}</table></div>`}
 if(tab==="Sales"){B.innerHTML=`<div class="row"><select class="f" id="lT"><option value="sale">Sale</option><option value="purchase">Purchase</option></select><input id="lA" type="number" placeholder="Amount DA"><input id="lN" placeholder="Note"><button class="btn" id="lAdd">Add</button></div>
  <div class="tbl"><table>${g("ledger").sort((a,b)=>b.ts-a.ts).map(x=>`<tr><td>${new Date(x.ts).toLocaleDateString()}</td><td>${x.type}</td><td>${money(x.amount)}</td><td>${esc(x.note||"")}</td><td><button data-del="ledger/${x.id}">✕</button></td></tr>`).join("")}</table></div>`;
  $("#lAdd").onclick=async()=>{const a=Number($("#lA").value);if(a>0)await db.collection("ledger").add({type:$("#lT").value,amount:a,note:$("#lN").value,ts:Date.now()})}}
 if(tab==="Comments")B.innerHTML=`<div class="tbl"><table>${g("comments").sort((a,b)=>b.ts-a.ts).map(x=>`<tr><td>${esc(x.post)}</td><td>${esc(x.text)}</td><td><button data-del="comments/${x.id}">✕</button></td></tr>`).join("")||"<tr><td>—</td></tr>"}</table></div>`;
 if(tab==="Questions")B.innerHTML=g("questions").sort((a,b)=>b.ts-a.ts).map(x=>`<div class="card"><b>${esc(x.name||"")}</b> <small>${new Date(x.ts).toLocaleString()}</small><p>${esc(x.text)}</p><textarea id="an-${x.id}" rows="2" placeholder="Answer (published when saved)">${esc(x.answer||"")}</textarea><button class="btn" data-ans="${x.id}">Publish answer</button> <button data-del="questions/${x.id}">✕</button></div>`).join("")||"—";
 if(tab==="Support")B.innerHTML=g("tickets").sort((a,b)=>b.ts-a.ts).map(x=>`<div class="card"><b>${esc(x.name||"")}</b> · ${esc(x.contact||"")} · ${x.status}<p>${esc(x.text)}</p><button class="btn alt" data-close="${x.id}">Mark closed</button> <button data-del="tickets/${x.id}">✕</button></div>`).join("")||"—";
 if(tab==="Ads")B.innerHTML=`<p>Ad slots shown on the site. Text shown in the slot (paste your ad message or sponsor name):</p><input id="aT" value="${esc(settings.adNote||"")}"><label><input type="checkbox" id="aO" ${settings.adsOff?"checked":""} style="width:auto"> Hide ad slots</label><br><button class="btn" id="aS">Save</button>`;
 if(tab==="Ads")$("#aS").onclick=()=>db.doc("settings/site").set({...settings,adNote:$("#aT").value,adsOff:$("#aO").checked});
 if(tab==="Settings"){B.innerHTML=`<p>Contact details, articles and colors are edited in the page file.</p><button class="btn alt" id="lo">Logout</button>`;$("#lo").onclick=()=>signOut(auth)}
}
document.addEventListener("click",async e=>{const t=e.target;
 if(t.dataset.tab){tab=t.dataset.tab;drawAdmin()}
 if(t.dataset.del&&confirm("Delete?"))await db.doc(t.dataset.del).delete();
 if(t.dataset.ans)await db.doc("questions/"+t.dataset.ans).update({answer:$("#an-"+t.dataset.ans).value});
 if(t.dataset.close)await db.doc("tickets/"+t.dataset.close).update({status:"closed"})});
$("#admLink").onclick=e=>{e.preventDefault();$("#adm").classList.add("open");drawAdmin()};
$("#admClose").onclick=()=>$("#adm").classList.remove("open");

/* runtime */
render();istg();
let auth=null,started=false,uid=localStorage.getItem("nc_uid");
if(!uid){uid=Math.random().toString(36).slice(2);try{localStorage.setItem("nc_uid",uid)}catch(_){}}
user={id:async()=>uid};
function startOwner(){if(started)return;started=true;
 ["likes","visits","tickets","ledger"].forEach(c=>db.collection(c).onSnapshot(s=>{D[c]=s.docs.map(d=>({id:d.id,...d.data()}));if($("#adm").classList.contains("open"))drawAdmin()}))}
try{
 if(FIREBASE_CONFIG.apiKey.startsWith("PASTE"))throw 0;
 const app=initializeApp(FIREBASE_CONFIG),fs=getFirestore(app);auth=getAuth(app);
 db={collection:n=>{const c=collection(fs,n);return{add:d=>addDoc(c,d),onSnapshot:(f,e)=>onSnapshot(c,f,e)}},
  doc:p=>{const r=doc(fs,p);return{set:d=>setDoc(r,d),update:d=>updateDoc(r,d),delete:()=>deleteDoc(r),onSnapshot:(f,e)=>onSnapshot(r,f,e)}}};
 db.collection("questions").onSnapshot(s=>{qaDocs=s.docs.map(d=>({id:d.id,...d.data()}));renderQA();if(owner){D.questions=qaDocs;if($("#adm").classList.contains("open"))drawAdmin()}});
 db.collection("comments").onSnapshot(s=>{D.comments=s.docs.map(d=>({id:d.id,...d.data()}));
  POSTS.forEach(p=>{const el=$("#cm-"+p.id);if(el)el.innerHTML=D.comments.filter(c=>c.post===p.id).sort((a,b)=>a.ts-b.ts).map(c=>`<p class="cm">${esc(c.text)}</p>`).join("")});
  if(owner&&$("#adm").classList.contains("open"))drawAdmin()});
 db.doc("settings/site").onSnapshot(s=>{settings=s.data()||{};paintAds()});
 if(!sessionStorage.getItem("nc_v")){sessionStorage.setItem("nc_v","1");db.collection("visits").add({ts:Date.now(),lang,tz:Intl.DateTimeFormat().resolvedOptions().timeZone||""}).catch(()=>{})}
 onAuthStateChanged(auth,u=>{owner=!!u&&u.email===ADMIN_EMAIL;if(owner)startOwner();if($("#adm").classList.contains("open"))drawAdmin()});
}catch(e){db=null}
</script>
</body>
</html>
